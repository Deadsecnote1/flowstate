name: CI

on:
  push:
    branches: [main, master, stage]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-glib-2.0 libglib2.0-bin

      - name: Compile Python modules
        run: python3 -m compileall -q src/todo

      - name: Run unit tests
        env:
          PYTHONPATH: src
          TODO_SKIP_SCHEMA_CACHE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Validate desktop file
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate data/io.github.thanushiyan.Todo.desktop

      - name: Validate AppStream (if available)
        run: |
          sudo apt-get install -y appstream || true
          if command -v appstreamcli >/dev/null; then
            appstreamcli validate --no-net data/io.github.thanushiyan.Todo.metainfo.xml || true
          fi
